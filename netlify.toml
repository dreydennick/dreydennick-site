# Dreyden Visual Atelier — static site, no build step
[build]
  publish = "."
  command = ""

# long cache for media, instant invalidation for html
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
