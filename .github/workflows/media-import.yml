name: media-import
on:
  push:
    branches: [media-import]
    paths: ['.github/workflows/media-import.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q gdown requests pillow pillow-heif
      - name: Frau Marlene — photos from Yandex Disk
        run: python3 .github/scripts/yadisk.py "https://disk.yandex.ru/d/CYtbxpx0sBNSeQ" _media/frau
      - name: Frau Marlene — film from Google Drive
        run: |
          mkdir -p /tmp/m assets/video _media/frau/video
          if gdown -q 1HPdFXnONsPzoIkjV0kfCw-zcOEkiIXWi -O /tmp/m/frau.mp4; then
            ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate:format=duration,size -of default=nw=1 /tmp/m/frau.mp4 > _media/frau/video/info.txt
            ffmpeg -y -v error -i /tmp/m/frau.mp4 -vf "scale='if(gt(iw,ih),min(1280,iw),-2)':'if(gt(iw,ih),-2,min(1280,ih))'" -c:v libx264 -profile:v high -pix_fmt yuv420p -crf 26 -preset slow -c:a aac -b:a 128k -movflags +faststart assets/video/frau-film.mp4
            ffmpeg -y -v error -i /tmp/m/frau.mp4 -vf "fps=1/3,scale='if(gt(iw,ih),1280,-2)':'if(gt(iw,ih),-2,1280)'" -q:v 3 _media/frau/video/%03d.jpg
            ls -la assets/video/frau-film.mp4 >> _media/frau/video/info.txt
          else
            echo "DRIVE DOWNLOAD FAILED" > _media/frau/video/info.txt
          fi
      - name: Commit results to this branch
        run: |
          git config user.name "media-import"
          git config user.email "actions@users.noreply.github.com"
          git add -A _media
          [ -f assets/video/frau-film.mp4 ] && git add assets/video/frau-film.mp4
          git commit -m "media-import: Frau Marlene photos + film"
          git push origin HEAD:media-import
