name: media-import
on:
  push:
    branches: [media-import]
    paths: ['.github/workflows/media-import.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: pip install -q gdown pillow
      - name: Frau Marlene poster from Google Drive
        run: |
          mkdir -p /tmp/m _media/poster
          gdown -q 1CjcYG0KnJsw_AUYJZ3KWbUNhB980xv4- -O /tmp/m/poster.png
          python3 - <<'PY'
          from PIL import Image
          Image.MAX_IMAGE_PIXELS = None
          im = Image.open('/tmp/m/poster.png'); print('source', im.size, im.mode)
          if im.mode in ('RGBA','LA','P'):
              im = im.convert('RGBA'); bg = Image.new('RGB', im.size, (12,12,13)); bg.paste(im, mask=im.split()[-1]); im = bg
          else:
              im = im.convert('RGB')
          for name, side, q in [('frau-poster', 2000, 86), ('frau-poster-t', 640, 82)]:
              t = im.copy(); t.thumbnail((side, side), Image.LANCZOS)
              t.save(f'_media/poster/{name}.jpg', quality=q, optimize=True, progressive=True)
              print(name, t.size)
          open('_media/poster/info.txt','w').write(f'source {im.size}\n')
          PY
      - name: Commit results to this branch
        run: |
          git config user.name "media-import"
          git config user.email "actions@users.noreply.github.com"
          git add -A _media/poster
          git commit -m "media-import: Frau Marlene poster v2"
          git push origin HEAD:media-import
